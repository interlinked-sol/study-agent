[project]
name = "study-agent"
version = "0.1.0"
description = "个性化学习系统：学习材料 → 考点清单/卡片/速查表（备考+自学双模式）"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0",
    "httpx>=0.27",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
study-agent = "study_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
